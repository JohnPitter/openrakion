; RakionWorldServ - worldserver.ini (template)
[Server]
ServerId=1
MaxUser=500
MaxField=2000
Port=40708

; Autenticacao do world (web). Type=0 no build testado.
[Authentication]
Type=0
Host=127.0.0.1
Port=80
AuthPage=/auth.asp
AllowPasswordLogin=1
Secured=1

[EMail]
CharacterDeleteSubject=Rakion
CharacterDeleteBodyFileName=deletion.txt

[MailSender]
Enabled=0
Sender=administrator@localhost
PickupFolder=mail-pickup

; Checagem de MD5 do cliente (tolerada no build v258).
[Client]
EnforceMD5=0
MD5_1=
MD5_2=
RequiredAppId=0
RequiredBuildVersion=0

; Como o world encontra o broker
[ServerList]
Count=1
IP0=127.0.0.1
Port0=40706

[Broker]
IP=127.0.0.1
Port=40706
Code=

[Clan]
Enabled=0
MaxMembers=99
TreeMaxChildren=7

; Banco de dados (ajuste credenciais)
[DB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[USERDB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[LOGDB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[UDP]
Port1=40708
Port2=40709
RelayCompatibilityEnabled=1
RelayPacketsPerSecond=300
RelayBurst=600
SendPoolCount=50

[Service]
Name=Rakion World
DisplayName=Rakion World
