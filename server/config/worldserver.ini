; RakionWorldServ - worldserver.ini (template)
[Server]
ServerId=1
MaxUser=500
MaxField=2000
Port=40708

; Autenticacao do world (web). Type=0 no build testado.
[Authentication]
Type=0
Host=127.0.0.1
Port=80
AuthPage=/auth.asp
Secured=1

; Checagem de MD5 do cliente (tolerada no build v258).
[Client]
MD5_1=D
MD5_2=<md5-do-gamemp.dll>

; Como o world encontra o broker
[ServerList]
Count=1
IP0=127.0.0.1
Port0=40706

[Broker]
IP=127.0.0.1
Port=40706

; Banco de dados (ajuste credenciais)
[DB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[USERDB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[LOGDB]
IP=localhost
Port=3306
User=root
Pass=CHANGE_ME
Name=rakion

[UDP]
Port1=40708
Port2=40709
SendPoolCount=50

[Service]
Name=Rakion World
DisplayName=Rakion World
