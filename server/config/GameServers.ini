; BrokerServer / BrokenServer - GameServers.ini (template)
; Define a lista de world servers que o broker ANUNCIA ao cliente.
; Os campos ip/wan + lan_wan controlam o "advertised IP" (o IP que o cliente
; vai usar para conectar no world). ESSE e' o ponto critico de "stuck at login".

[SERVERS]
1=LanServer

[LanServer]
ID=1
Name=WorldServer1
; ip  = IP anunciado quando lan_wan=0 (LAN)
; wan = IP anunciado quando lan_wan=1 (WAN)
ip=127.0.0.1
wan=127.0.0.1
port=40708
ipcport=40708
; 0 = usa 'ip' (LAN) | 1 = usa 'wan' (WAN/publico)
lan_wan=0
